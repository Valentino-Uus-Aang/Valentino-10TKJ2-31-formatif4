<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>
    <style>
        /* Tag Selector */
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        h2 {
            color: #1a252f;
            font-size: 20px;
        }

        /* Class Selector untuk semua tombol */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        /* Descendant Selector: jarak antar tombol di dalam button-group */
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* Class Selector untuk warna latar masing-masing tombol */
        .btn-primary {
            background-color: navy;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: rgb(180, 180, 200);
        }

        .btn-outline {
            background-color: #ffffff;
            border: 2px solid #333333;
        }

        .btn-send {
            background-color: #d35400;
            color: #ffffff;
        }

        /* Grouping Selector: dua tombol berbagi warna tulisan gelap */
        .btn-secondary, .btn-outline {
            color: #333333;
        }

        /* Pseudo-class Selector (:hover) untuk mengubah warna saat kursor di atas tombol */
        .btn-primary:hover {
            background-color: #000044;
        }

        .btn-secondary:hover {
            background-color: rgba(150, 150, 170, 0.8);
        }

        .btn-outline:hover {
            background-color: #f0f0f0;
        }

        .btn-send:hover {
            background-color: #ba4a00;
        }
    </style>
</head>
<body>

    <main>
        <!-- Kumpulan 4 Tombol -->
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <a href="/index.html" style="color: #000066; text-decoration: underline; font-family: Arial, sans-serif; font-size: 16px;">Kembali ke Beranda</a>
    </footer>

</body>
</html>
